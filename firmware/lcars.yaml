esphome:
  name: lcars-controller
  friendly_name: LCARS Controller
  min_version: 2026.8.2
  includes:
    - lighting_config.h
    - transit_model.h
    - transit_json.h
    - transit_client.h
    - transit_icons.h
    - weather_model.h
    - weather_icons.h
    - weather_client.h
    - controller_state.h
    - lcars_ui.h
    - pcm_playback.h
    - ui_sounds.h
    - sd_signature.h
    - sd_probe.h
    - sd_file_test.h
    - sd_maintenance.h
  project:
    name: tribecans.lcars-controller
    version: "1.9.1"
  on_boot:
    priority: -100
    then:
      # ESPHome's MipiRgb::loop() requests an LCD DMA restart on every pass.
      # LVGL writes the RGB frame buffer directly, and the IDF driver already
      # detects missed bounce-buffer transfers at VSYNC. Avoid periodic
      # visible resynchronization during the HTTPS transit fetch.
      - lambda: id(lcd).disable_loop();
      - lambda: lcars::probe_sd_read_only();
      - component.update: sd_card_status

globals:
  - id: transit_api_token
    type: std::string
    restore_value: false
    initial_value: !secret transit_api_key_literal
  - id: sound_volume
    type: float
    restore_value: true
    initial_value: '0.60f'
  - id: screen_inverted
    type: bool
    restore_value: true
    initial_value: 'false'

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_VFS_SUPPORT_DIR: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "256"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "65536"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

logger:
  level: INFO
  baud_rate: 115200
  hardware_uart: UART0

wifi:
  id: wifi_connection
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s

api:
  id: ha_api
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s
  actions:
    - action: sd_card_maintenance
      variables:
        command: string
      then:
        - lambda: lcars::sd_maintenance.start(command);
        - component.update: sd_card_status

button:
  - platform: restart
    name: Controller Restart
    id: controller_restart
    entity_category: diagnostic

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: sntp
    id: transit_clock
    timezone: Europe/Zurich

# Declare an image widget so ESPHome enables LVGL's image renderer. The panel
# shares embedded icon descriptors with its native layout tests.
image:
  - file: transit_assets/tram.png
    id: transit_image_renderer
    type: RGB565
    transparency: alpha_channel

i2s_audio:
  - id: audio_bus
    i2s_bclk_pin: GPIO0
    i2s_lrclk_pin: GPIO18

speaker:
  - platform: i2s_audio
    id: sound_speaker
    i2s_audio_id: audio_bus
    dac_type: external
    i2s_dout_pin: GPIO17
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit
    buffer_duration: 1s
    timeout: 2s

i2c:
  sda: GPIO19
  scl: GPIO20
  scan: true
  frequency: 100kHz

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO2
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: backlight
    name: Display Brightness
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    gamma_correct: 1.0
    initial_state:
      state: true
      brightness: 60%

display:
  - platform: mipi_rgb
    id: lcd
    model: RPI
    dimensions: 800x480
    color_order: RGB
    pclk_frequency: 13MHz
    pclk_inverted: true
    de_pin: GPIO40
    hsync_pin: GPIO39
    vsync_pin: GPIO41
    pclk_pin: GPIO42
    hsync_front_porch: 4
    hsync_pulse_width: 4
    hsync_back_porch: 8
    vsync_front_porch: 4
    vsync_pulse_width: 4
    vsync_back_porch: 8
    data_pins:
      red: [GPIO45, GPIO48, GPIO47, GPIO21, GPIO14]
      green: [GPIO5, GPIO6, GPIO7, GPIO15, GPIO16, GPIO4]
      blue: [GPIO8, GPIO3, GPIO46, GPIO9, GPIO1]
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: gt911
    id: touch
    display: lcd
    # The vendor's music example disables the GT911 interrupt (-1):
    # GPIO18 is the speaker LRCLK. Poll touch instead of sharing that pin.
    update_interval: 20ms
    reset_pin: GPIO38
    # The vendor library flips both axes, then its LVGL adapter flips them
    # back. ESPHome receives raw GT911 coordinates, so no mirroring is needed.
    on_touch:
      - lambda: |-
          ESP_LOGI("lcars", "Touch at %d,%d (raw %d,%d)", touch.x, touch.y, touch.x_raw, touch.y_raw);

lvgl:
  id: display_ui
  rotation: 0
  displays: [lcd]
  touchscreens: [touch]
  color_depth: 16
  buffer_size: 25%
  default_font: montserrat_20
  bg_color: 0x060608
  widgets:
    - obj:
        id: lcars_root
        width: 800
        height: 480
        border_width: 0
        pad_all: 0
        radius: 0
        bg_color: 0x060608
    - button:
        hidden: true
        widgets:
          - label:
              text: ""
              text_font: montserrat_28
          - label:
              text: ""
              text_font: montserrat_16
    - slider:
        hidden: true
    - image:
        hidden: true
        src: transit_image_renderer
  on_boot:
    - lambda: |-
        lcars::panel.build(id(lcars_root),
          [](size_t index, bool on) { id(set_power).execute(index, on); },
          [](size_t index, uint32_t request) { id(activate_scene).execute(index, request); },
          [](int level, uint32_t request) { id(set_living_brightness).execute(level, request); },
          [](float value) {
            auto call = id(backlight).turn_on();
            call.set_brightness(value);
            call.perform();
          },
          [](bool inverted) { id(set_orientation).execute(inverted); },
          id(screen_inverted),
          [](lcars::SoundEffect effect) { id(play_feedback).execute(static_cast<int>(effect)); },
          [](float volume) { id(set_sound_volume).execute(volume); },
          id(sound_volume));
    - lvgl.display.set_rotation:
        lvgl_id: display_ui
        rotation: !lambda |-
          return id(screen_inverted) ? 180 : 0;

interval:
  - interval: 250ms
    then:
      - lambda: |-
          if (lcars::sd_maintenance.poll()) id(sd_card_status).update();
  - interval: 10ms
    then:
      - lambda: |-
          auto result = lcars::sound_playback.pump(*id(sound_speaker), millis());
          if (result == lcars::PcmPlayback::Result::FINISHED) {
            lcars::panel.sound_status(false);
            ESP_LOGI("lcars", "Feedback sound finished");
          } else if (result == lcars::PcmPlayback::Result::FAILED) {
            lcars::panel.sound_status(false, true);
            ESP_LOGE("lcars", "Feedback sound failed");
          }
  - interval: 1s
    then:
      - lambda: |-
          lcars::transit_client.tick(id(wifi_connection).is_connected(), id(transit_api_token));
          lcars::weather_client.tick(id(wifi_connection).is_connected(),
            id(home_latitude).has_state() && id(home_longitude).has_state(),
            id(home_latitude).state, id(home_longitude).state, lcars::transit_client.busy());
          lcars::panel.transit_tick(lcars::transit_client.board, std::time(nullptr), id(wifi_connection).is_connected());
          lcars::panel.weather_tick(lcars::weather_client.reading, std::time(nullptr), id(wifi_connection).is_connected());
          lcars::panel.connection(id(wifi_connection).is_connected(), id(ha_api).is_connected_with_state_subscription());
          lcars::panel.tick(id(device_ip).state);

