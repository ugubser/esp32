sensor:
  - platform: homeassistant
    id: home_latitude
    entity_id: zone.home
    attribute: latitude
    internal: true
  - platform: homeassistant
    id: home_longitude
    entity_id: zone.home
    attribute: longitude
    internal: true
  - platform: homeassistant
    id: living_brightness
    entity_id: light.living
    attribute: brightness
    on_value:
      - lambda: |-
          lcars::panel.connection(id(wifi_connection).is_connected(), id(ha_api).is_connected_with_state_subscription());
          lcars::panel.update_brightness(x);

script:
  - id: set_sound_volume
    parameters:
      volume: float
    then:
      - lambda: |-
          id(sound_volume) = volume;
          sound_volume->update();
          esphome::global_preferences->sync();
          id(sound_speaker)->set_volume(volume);
          ESP_LOGI("lcars", "Speaker volume: %.0f%% (saved)", volume * 100.0f);
  - id: play_feedback
    parameters:
      effect: int
    then:
      - lambda: |-
          if (!lcars::sound_playback.active() && !id(sound_speaker)->is_failed() &&
              id(sound_speaker)->is_stopped()) {
            id(sound_speaker)->set_audio_stream_info(esphome::audio::AudioStreamInfo(16, 1, 16000));
            id(sound_speaker)->set_volume(id(sound_volume));
            const bool menu = effect == static_cast<int>(lcars::SoundEffect::MENU);
            const uint8_t *clip = menu ? lcars::MENU_SELECTION_SOUND : lcars::CONTROL_ACTION_SOUND;
            const size_t clip_size = menu ? sizeof(lcars::MENU_SELECTION_SOUND) : sizeof(lcars::CONTROL_ACTION_SOUND);
            if (lcars::sound_playback.begin(clip, clip_size, millis())) {
              lcars::panel.sound_status(true);
              ESP_LOGI("lcars", "%s feedback sound started", menu ? "Menu" : "Action");
            }
          } else if (id(sound_speaker)->is_failed()) {
            lcars::panel.sound_status(false, true);
          }
  - id: set_orientation
    parameters:
      inverted: bool
    then:
      - lambda: id(screen_inverted) = inverted;
      - lambda: |-
          screen_inverted->update();
          esphome::global_preferences->sync();
      - lvgl.display.set_rotation:
          lvgl_id: display_ui
          rotation: !lambda |-
            return inverted ? 180 : 0;
      - lambda: |-
          lcars::panel.rotation_changed(inverted);
          ESP_LOGI("lcars", "Orientation: %d degrees (saved)", inverted ? 180 : 0);
  - id: set_power
    mode: parallel
    max_runs: 9
    parameters:
      index: int
      power_on: bool
    then:
      - homeassistant.action:
          action: !lambda |-
            return std::string(lcars::ENTITIES.at(index).is_switch ? "switch." : "light.") + (power_on ? "turn_on" : "turn_off");
          data:
            entity_id: !lambda return std::string(lcars::ENTITIES.at(index).id);
          on_error:
            - lambda: lcars::panel.fail(index);
  - id: activate_scene
    mode: parallel
    max_runs: 2
    parameters:
      index: int
      request: int
    then:
      - homeassistant.action:
          action: scene.turn_on
          data:
            entity_id: !lambda return std::string(lcars::SCENES.at(index).id);
          on_success:
            - lambda: lcars::panel.living_result(request, true);
          on_error:
            - lambda: lcars::panel.living_result(request, false);
  - id: set_living_brightness
    mode: parallel
    max_runs: 2
    parameters:
      level: int
      request: int
    then:
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: light.living
            brightness_pct: !lambda return std::to_string(level);
          on_success:
            - lambda: lcars::panel.living_result(request, true);
          on_error:
            - lambda: lcars::panel.living_result(request, false);
